<style>

.ans input.no{border-color:var(--bad);background:#FDF3F2}
.tick{font-size:19px}.tick.ok{color:var(--good)}.tick.no{color:var(--bad)}
.hint{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.2em;color:var(--soft)}
.acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.acts button{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:2px;
 padding:11px 20px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;font-weight:600}
.acts button.ghost{background:transparent;color:var(--ink)}
.score{margin-top:22px;padding:16px 18px;background:var(--accent-l);border-left:4px solid var(--accent);
 font-size:16px;display:none}
.score.on{display:block}
.novoice{font-size:13px;color:var(--bad);margin-bottom:16px;display:none}
.novoice.on{display:block}
@media(max-width:560px){.book{grid-template-columns:46px 1fr;gap:12px}.spine{height:70px;font-size:24px}
 .ans{padding-left:0}.itop{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const BOOKS = [{"title": "The Shed Key", "blurb": "Nobody has opened the shed at the back of Gogo's yard for eleven years. This holiday, Anele finds out why.", "n": 1, "pages": [["## One", "The shed at the back of Gogo's yard had a padlock on it that had gone orange with rust, and the key hung on a nail inside the kitchen door where everybody could see it and nobody touched it."], ["Anele had been coming to that house every school holiday of his life. He was nine. He had walked past that key perhaps two thousand times.", "This was the first holiday he actually looked at it."], ["## Two", "“What is in the shed?”", "Gogo was shelling peas. She did not look up.", "“Things,” she said.", "“What things?”", "“Old things. Nothing you would want.”", "Which was, Anele thought, exactly the kind of answer that makes a person want something."], ["## Three", "He asked his mother that night.", "She was quiet for slightly too long before she answered, and he noticed it, and he filed it away."], ["“It was your grandfather's,” she said. “He kept his tools in there. She has not opened it since he died.”", "“When did he die?”", "“Before you were born. Eleven years.”"], ["## Four", "Anele did not ask again for four days.", "He had learned, mostly from being the youngest, that asking twice in one week gets you a no, and asking once a week gets you a maybe."], ["On the fifth day he was helping Gogo carry water and he said, not looking at her, “I could clean it out. The shed. If you wanted.”"], ["## Five", "She stopped walking.", "She put the bucket down on the step and stood there with her hand on it, and Anele thought he had made a serious mistake, and he started working out how to take it back."], ["“The lock will be seized,” she said at last. “You will need oil.”", "And that was all she said, and she picked up the bucket and went inside."], ["## Six", "The lock took an hour and a half.", "He put cooking oil into it with a teaspoon and worked the key back and forth, a tiny bit at a time, and three times he was certain the key was going to snap off inside it."], ["When it finally turned it made a sound like a small bone breaking and he felt it in his teeth."], ["## Seven", "The door had swollen into the frame. He had to lift it and pull at the same time."], ["Inside it was dark and dry and it smelled of dust and old paraffin, and there were spider webs across the doorway thick enough to feel.", "He stood there for a while letting his eyes get used to it."], ["## Eight", "The tools were all still on the wall."], ["They were hanging in a line on nails, in order of size, each one with its own outline drawn around it on the board in black pencil, so that anybody could see at a glance which one was missing."], ["None of them were missing. Every single tool was in its own outline."], ["## Nine", "That was the thing Anele could not stop looking at."], ["Somebody had stood in this shed and drawn around every tool he owned, so that he would know where they went.", "And then one day he had put every one of them back, and shut the door, and never come again."], ["## Ten", "He worked in there for three days.", "He swept. He oiled the hinges. He wiped the tools one at a time with a rag and paraffin and put each one back inside its own outline."], ["Gogo did not come in. She brought him tea twice a day and left it on the step outside, which he understood, and which he did not mention."], ["## Eleven", "On the fourth day she came to the door and stood in it.", "She looked at the wall of tools for a long time without saying anything at all."], ["“He drew those lines the week we moved in,” she said. “It took him a whole Sunday. I thought it was a silly thing to spend a Sunday on.”"], ["## Twelve", "The shed is open now. There is a bicycle in it, and paint, and the lawnmower, and Anele's cousin keeps her school bag in there in the mornings for reasons nobody has explained."], ["The tools are still on the wall in their outlines. Nobody has moved one.", "Anele uses them and puts them back. That is the only rule and nobody has ever had to say it out loud."]], "wc": 721, "words": [{"w": "padlock", "m": "a lock you can take off and carry"}, {"w": "kitchen", "m": "the room where food is made"}, {"w": "grandfather", "m": "your mother's or father's father"}, {"w": "tools", "m": "things you use to build and fix"}, {"w": "bucket", "m": "you carry water in it"}, {"w": "teaspoon", "m": "the small spoon you stir tea with"}, {"w": "paraffin", "m": "a liquid fuel used in lamps and stoves"}, {"w": "outline", "m": "a line drawn around the edge of something"}, {"w": "hinges", "m": "the door turns on these"}, {"w": "bicycle", "m": "it has two wheels and you pedal it"}]}, {"title": "Teaching Lindiwe", "blurb": "Sipho promises to teach his sister to ride a bicycle in one holiday. He has never taught anybody anything in his life.", "n": 2, "pages": [["## One", "“I could teach you,” said Sipho, in the way people say things when they have not thought about them."], ["Lindiwe was seven. She had wanted to ride the bicycle for about a year and she had never once asked anybody, because asking would have meant admitting she could not."], ["“When?” she said, immediately.", "That was when Sipho understood he had made a promise."], ["## Two", "The first day went badly.", "He held the back of the seat and ran alongside and shouted <i>pedal</i>, and she pedalled twice and then stopped pedalling and put both feet down and the bicycle stopped."], ["They did that eleven times.", "On the twelfth time she got off and sat down on the grass and said she did not want to any more."], ["## Three", "Sipho was cross for the rest of the afternoon, and then, lying in bed, he stopped being cross and started thinking."], ["She was not scared of falling. He had watched her jump off the wall at the shop more times than he could count.", "She was scared of the moment when he let go."], ["## Four", "The next morning he did not hold the seat."], ["“Today we are not riding,” he said. “Today you are just going to sit on it and walk it along with your feet on the ground.”", "“That is not riding.”", "“No,” said Sipho. “It is not.”"], ["She walked it up and down the road for forty minutes, looking bored, and did not fall over once."], ["## Five", "On the third day he took the pedals off with a spanner.", "His father watched him do it and asked why and Sipho explained, and his father said nothing and went back inside, which from his father was a good review."], ["Without pedals she could push along with her feet and lift them up and glide for two or three metres at a time."], ["## Six", "That was the day it happened, and neither of them noticed it happening."], ["She pushed off outside the gate and lifted her feet and glided all the way past the third house, which was about twenty metres, steering the whole way."], ["She was balancing. She had been balancing for twenty metres. There was nothing left to teach her except how to turn the pedals, and she had known how to do that since she was three."], ["## Seven", "He put the pedals back on that evening.", "“Tomorrow,” he said.", "“Why not now?”", "“Because it is getting dark and because I am tired and because I said tomorrow.”"], ["The real reason, which he did not say, was that he wanted to watch it properly and not in bad light."], ["## Eight", "She rode on the fourth morning.", "She rode from the gate to the corner without stopping and turned around at the corner without putting her foot down, which he had not expected at all, and came back."], ["Then she did it again eleven times because she would not get off."], ["## Nine", "Their mother came out to watch and stood next to Sipho with her arms folded."], ["“Four days,” she said. “It took your father a month to teach you.”", "“It took him a month because he held the seat,” said Sipho, and then heard himself, and shut up.", "His mother laughed for about a minute."], ["## Ten", "Lindiwe is grown now and she still rides that same bicycle, which has been repainted twice."], ["She tells people her brother taught her in four days.", "Sipho, when he is there, always says the same thing, which is that he did not teach her anything. He just stopped holding on, and took the pedals off, and got out of the way."], ["He says the hard part was not the teaching.", "The hard part was working out that the thing he was doing was the thing that was stopping her."]], "wc": 626, "words": [{"w": "bicycle", "m": "it has two wheels and you pedal it"}, {"w": "promise", "m": "when you say you will definitely do something"}, {"w": "pedal", "m": "you push it round with your foot"}, {"w": "afternoon", "m": "the time after midday"}, {"w": "spanner", "m": "a tool for turning nuts and bolts"}, {"w": "balancing", "m": "staying upright without falling"}, {"w": "steering", "m": "making something go where you want"}, {"w": "corner", "m": "where two roads meet"}, {"w": "mother", "m": "the woman who is your parent"}, {"w": "repainted", "m": "painted again"}]}, {"title": "The Holiday Job", "blurb": "Karabo wants a pair of boots that cost R380. He has nineteen days and a wheelbarrow.", "n": 3, "pages": [["## One", "The boots were in the window of the shop next to the taxi rank and they cost three hundred and eighty rand."], ["Karabo had looked at them eleven times. He knew exactly which shelf they were on.", "He had forty-two rand."], ["The holiday was nineteen days long. That was the whole of the arithmetic and he did it on the back of a receipt."], ["## Two", "He needed three hundred and thirty-eight rand in nineteen days.", "That was about eighteen rand a day.", "Eighteen rand a day did not sound like very much until he tried to think of a single way to make it."], ["He sat on the step for most of the first morning of the holidays, thinking, and came up with nothing at all."], ["## Three", "The idea came from his aunt, who was not trying to help.", "She came past with two enormous bags from the shops and put them down at the gate and said, to nobody, “I am too old for this hill.”"], ["Karabo carried them up for her. She gave him five rand.", "He stood at the gate afterwards looking at the five rand and then looking down the hill at the taxi rank, where about forty people were getting off taxis with bags."], ["## Four", "The wheelbarrow belonged to nobody in particular, which in that yard meant it belonged to whoever was using it."], ["It had a flat tyre. He pumped it and it went down again in an hour, so he pumped it every hour, which was annoying but which cost nothing."], ["He wrote his prices on a piece of cardboard: <b>R5 a load. Up the hill only.</b>"], ["## Five", "The first day he made twenty rand.", "The second day he made thirty-five.", "The third day it rained and he made nothing at all, and he sat inside and was miserable, and that was the day he learned the most."], ["What he learned was that a plan with no bad days in it is not a plan."], ["## Six", "So he changed it.", "He started going down at half past eleven, because that was when the shops emptied out, instead of at eight when he felt like starting."], ["He stopped saying <i>R5 a load</i> and started saying <i>Can I carry that for you, ma?</i> and letting people decide, and he made more that way, which surprised him and still surprises him."], ["## Seven", "By day twelve he had two hundred and sixty rand in a jam jar."], ["By day sixteen he had three hundred and ten.", "On day seventeen his mother's electricity ran out on a Sunday when nobody could buy any, and Karabo did not say anything, and went and got eighty rand out of the jar and put it on the table."], ["She looked at it. She looked at him.", "She did not say thank you, which he understood, because thank you would have made it a loan."], ["## Eight", "So he did not get the boots.", "He got to two hundred and ninety by the last day and the holiday ended and school started and the boots stayed in the window."], ["They were still there in December. By then he had five hundred and twenty rand."], ["## Nine", "He bought them on a Saturday in the middle of December."], ["They were exactly as good as he had thought they would be, which almost never happens.", "He wore them until they came apart at the toe two years later and then he kept them anyway, in a box."], ["## Ten", "The thing he tells people about that holiday is not about the boots."], ["It is that he still has the piece of cardboard with the prices on it, and that on the back of it, in his own handwriting, is every single day of that holiday and what he made."], ["Nineteen days. Two rained. One he made nothing because nobody needed him.", "“I thought I was saving for boots,” he says. “I was actually finding out that I could do it. The boots were the cheap part.”"]], "wc": 660, "words": [{"w": "boots", "m": "strong shoes that cover your ankle"}, {"w": "shelf", "m": "things stand on it in a shop"}, {"w": "receipt", "m": "the slip that shows what you paid"}, {"w": "arithmetic", "m": "working with numbers"}, {"w": "wheelbarrow", "m": "it has one wheel and two handles"}, {"w": "cardboard", "m": "thick stiff paper"}, {"w": "miserable", "m": "very unhappy"}, {"w": "electricity", "m": "it makes the lights work"}, {"w": "handwriting", "m": "the way a person writes by hand"}, {"w": "December", "m": "the last month of the year"}]}, {"title": "The Thing About Silence", "blurb": "Thandeka's grandmother has not spoken since February. Everybody says she cannot. This holiday, Thandeka works out that this is not quite true.", "n": 4, "pages": [["## One", "Gogo had a stroke in February and after that she did not speak.", "She could move her right hand. She could eat and she could walk a little way with somebody holding her arm.", "She just did not speak."], ["Everybody in the family said the same sentence about it: <i>She cannot talk any more.</i>"], ["## Two", "Thandeka came for the July holidays and then again for the September ones."], ["In July she had been frightened of Gogo, which she was ashamed of and did not tell anybody.", "The stillness of her was frightening. You would say something and there would be nothing back, and you would keep talking into the nothing until you ran out."], ["By September she was not frightened. She was something else that she did not have a word for."], ["## Three", "It was on the third day that she noticed the hand.", "She had been reading out loud from the newspaper, which is what everybody did with Gogo because it filled the silence."], ["She read something about the price of bread going up again, and Gogo's right hand, lying on the blanket, opened and closed. Once."], ["## Four", "Thandeka stopped reading.", "She waited. Nothing happened for a long time.", "Then she read the next part, which was about a soccer match, and the hand did not move at all."], ["She went back to the part about the bread and read it again, and the hand opened and closed twice."], ["## Five", "She did not tell anybody for two days."], ["This was partly because she was not sure, and partly because she knew exactly what her aunt would say, which was <i>that is just a muscle, my child</i>, and she did not want to hear it yet."], ["Instead she started writing it down. Time, what she had said, what the hand did."], ["## Six", "By the end of the week she had four pages."], ["The hand moved for: the price of things. Her grandfather's name. The word <i>church</i>. Anything about her youngest aunt, who lived in Durban and did not visit.", "The hand did not move for: weather, sport, anything on television, or the names of any of the great-grandchildren, which Thandeka wrote down and then looked at for a while and felt sad about."], ["## Seven", "When she showed the pages to her mother, her mother read them twice and then went outside and stood in the yard for a few minutes."], ["“It might be nothing,” Thandeka said, when she came back in. She had been practising saying that, so that she would say it before somebody else did."], ["“It might be,” said her mother. “Show me the one about Durban.”"], ["## Eight", "They phoned the aunt in Durban that night.", "Thandeka did not hear most of the conversation. It went on for a long time and there was some shouting near the middle of it and none at the end."], ["The aunt came in October. She had not been to that house in three years and nobody has ever fully explained to Thandeka why."], ["## Nine", "Gogo's hand opened and closed for about a minute when the aunt walked in.", "Everybody saw it. Nobody said anything about it, then or afterwards, and Thandeka has thought about that a great deal since."], ["Her aunt sat next to the bed for four hours that first day and talked without stopping, which Thandeka thought at the time was strange, and which she now understands completely."], ["## Ten", "Gogo died in the February after that, a year almost to the day."], ["Thandeka kept the pages. They are in a folder with the newspaper cutting about the price of bread, which she cut out for no reason at the time."], ["What she says about it now is not that she proved anything, because she did not.", "It is that everybody in that family had agreed on one sentence — <i>she cannot talk any more</i> — and had stopped looking, and she was eleven and did not know you were allowed to stop looking, so she carried on."]], "wc": 659, "words": [{"w": "stroke", "m": "an illness that damages the brain"}, {"w": "February", "m": "the second month of the year"}, {"w": "blanket", "m": "you put it over you in bed"}, {"w": "newspaper", "m": "you read the news in it"}, {"w": "silence", "m": "when there is no sound at all"}, {"w": "frightened", "m": "afraid"}, {"w": "muscle", "m": "it makes your body move"}, {"w": "conversation", "m": "when people talk to each other"}, {"w": "October", "m": "the tenth month of the year"}, {"w": "folder", "m": "you keep papers in it"}]}, {"title": "The Radio That Would Not Die", "blurb": "Grandpa's radio stopped working in 1998. He has kept it on the shelf ever since. This holiday, Lwazi opens it up.", "n": 5, "pages": [["## One", "The radio sat on the top shelf in Grandpa's kitchen, brown and heavy, with a cloth front and two big round knobs."], ["It had not worked since 1998. Lwazi knew the year because Grandpa said it every time anybody asked why he kept it."], ["“It played the whole of 1994 for me,” Grandpa said. “Every single day of that year. I am not throwing it away because it is tired.”"], ["## Two", "On the second day of the holidays Lwazi asked if he could open it."], ["Grandpa thought about it for longer than Lwazi expected.", "“Open it,” he said. “Do not throw anything away. Put every screw in a cup.”"], ["## Three", "The back came off with six screws. Lwazi put them in a cup."], ["Inside it was not what he expected. He had expected wires, and there were wires, but there were also small glass things like light bulbs, and a smell of old dust that got into his nose."], ["He sat and looked at it for a long time without touching anything, which Grandpa said afterwards was the cleverest thing he did all week."], ["## Four", "The first thing he found was the plug."], ["The wire going into it had come loose. One of the little copper strands inside was not touching anything at all.", "Somebody had pulled the radio out of the wall by the cord, probably in 1998, and that was that."], ["“Could it be that simple?” Lwazi said.", "“Sometimes it is,” said Grandpa. “Mostly it is not.”"], ["## Five", "Grandpa showed him how to fix a plug properly: strip the wire, twist the strands, put each one under the right screw."], ["Brown wire to the right. Blue wire to the left. Green and yellow to the top.", "Lwazi did it twice because the first time one strand was sticking out, and Grandpa would not let him plug it in until it was perfect."], ["## Six", "They plugged it in and turned the knob."], ["Nothing happened for about five seconds.", "Then there was a hum, very low, and one of the glass tubes inside began to glow orange, slowly, like a coal."], ["And then a crackle. And then a voice, very faint, talking about the weather in Mpumalanga."], ["## Seven", "Grandpa did not say anything for a while."], ["He stood in the kitchen with his hand on the counter and listened to a man talk about the weather in Mpumalanga as if it were the most important thing he had ever heard."], ["Then he turned the other knob, slowly, and found a station playing music, and turned it up."], ["## Eight", "The radio works most days now. Some days it crackles and has to be hit on the side, gently, which Grandpa says is also how you fix most people."], ["It lives on the kitchen table now, not the top shelf.", "It plays in the mornings while he makes his tea."], ["## Nine", "What Lwazi remembers is not the plug. It is the five seconds before the hum."], ["Five seconds of standing in the kitchen not knowing if it would work, with Grandpa standing next to him, both of them holding their breath."], ["He has fixed a lot of things since then. It is always the five seconds that he remembers."]], "wc": 529, "words": [{"w": "radio", "m": "you listen to music and news on it"}, {"w": "kitchen", "m": "the room where food is made"}, {"w": "screws", "m": "small metal pins that twist into things"}, {"w": "wires", "m": "thin metal threads that carry electricity"}, {"w": "copper", "m": "an orange-brown metal"}, {"w": "perfect", "m": "with nothing wrong at all"}, {"w": "weather", "m": "sun, rain, wind or cold"}, {"w": "station", "m": "a place on the radio you tune to"}, {"w": "counter", "m": "a flat top in a kitchen"}, {"w": "breath", "m": "the air you take in and let out"}]}, {"title": "The Market Table", "blurb": "Naledi's aunt gives her one table at the Saturday market and one rule: whatever she makes, she keeps. Whatever she loses, she pays for.", "n": 6, "pages": [["## One", "Aunt Zodwa sold vegetables at the Saturday market by the station, and had done for eleven years."], ["On the first Saturday of the holidays she put a folding table next to her own and said to Naledi, “That one is yours.”"], ["“What do I sell?”", "“That is your problem,” said Aunt Zodwa. “One rule. What you make, you keep. What you lose, you pay for.”"], ["## Two", "Naledi spent the whole week deciding."], ["She thought about sweets, but the sweet man was already there with a trolley and he would beat her on price.", "She thought about cooldrinks, but she had no way of keeping them cold."], ["In the end she decided on something nobody else at the market sold, which was a sign that should have worried her more than it did."], ["## Three", "She made bracelets out of beads. Forty of them.", "It took her four evenings and her fingers hurt."], ["She priced them at twenty rand each, because that seemed like a fair number.", "She did not do any sums at all."], ["## Four", "On the second Saturday she sold two bracelets."], ["Two. In six hours.", "Aunt Zodwa sold about four hundred rand of vegetables at the table next to her, and said nothing, which was worse than saying something."], ["That night Naledi sat down with a pencil and did the sums she should have done at the beginning."], ["## Five", "The beads had cost her one hundred and twenty rand.", "She had sold two bracelets for twenty rand each. That was forty rand."], ["She had lost eighty rand. On the rule, she owed it.", "She sat and looked at the number for a long time."], ["## Six", "The next morning she watched the market properly instead of just standing at her table."], ["She noticed who came past. Mostly it was women with shopping bags and small children pulling at them. The children always looked at the bracelets. The mothers always pulled them away."], ["Twenty rand was too much for a thing a child wanted and a mother had not planned to buy."], ["## Seven", "On the third Saturday she changed two things."], ["She dropped the price to ten rand.", "And she moved the bracelets to the front edge of the table, low down, at the height of a small child's eyes."], ["She sold eleven."], ["## Eight", "Eleven bracelets at ten rand is one hundred and ten rand.", "That was more than two bracelets at twenty, by a long way."], ["She had not known that lowering the price could make you more money. It felt like a trick."], ["Aunt Zodwa said it was not a trick. It was the whole of business, and most adults never worked it out."], ["## Nine", "By the last Saturday of the holidays she had sold thirty-one bracelets.", "She had paid back her eighty rand and made one hundred and ninety on top of it."], ["She has the notebook still. The first page just says <i>20 rand each</i>.", "Every page after that is sums."]], "wc": 486, "words": [{"w": "market", "m": "a place where people sell things at tables"}, {"w": "vegetables", "m": "plants we eat, like carrots"}, {"w": "folding", "m": "it bends so it can be packed away"}, {"w": "trolley", "m": "a cart with wheels"}, {"w": "bracelets", "m": "you wear these on your wrist"}, {"w": "evenings", "m": "the time before night"}, {"w": "pencil", "m": "you write with it and can rub it out"}, {"w": "shopping", "m": "buying things at a shop"}, {"w": "business", "m": "buying and selling to make money"}, {"w": "notebook", "m": "a small book you write in"}]}, {"title": "The Wrong Name", "blurb": "A new boy joins the holiday soccer club. Everybody calls him Thabo. His name is not Thabo.", "n": 7, "pages": [["## One", "The holiday soccer club met every morning at the school field from nine until twelve."], ["On the second day a new boy came. He was small and quick and he did not say much."], ["The coach had a list. He looked at it and said, “Thabo?” and the boy nodded, and from then on everybody called him Thabo."], ["## Two", "Sibu noticed on the third day that he did not always turn around when you shouted it."], ["Somebody would shout <i>Thabo, pass!</i> and he would keep running, and then a second later turn his head, as if he had only just remembered."], ["Sibu noticed. He did not say anything. He noticed it again on the fourth day, and the fifth."], ["## Three", "On the sixth day they were sitting on the grass at break and Sibu asked him straight out.", "“Is Thabo your real name?”"], ["The boy looked at him for a while, deciding something.", "“No,” he said. “My name is Thapelo. Thabo is a different boy on the list. He never came.”"], ["“Why did you not say?”", "Thapelo shrugged. “The coach said it on the first day. Everybody heard it. It was too late.”"], ["## Four", "Sibu thought about that all afternoon."], ["It was not really too late. It had only been six days. But he understood completely what Thapelo meant, because he had felt exactly that way himself about smaller things."], ["The longer a mistake goes on, the harder it is to be the person who stops it."], ["## Five", "The next morning Sibu did something he had never done before, which was to go up to the coach before practice started."], ["“Coach, his name is not Thabo. It is Thapelo.”", "The coach looked down at his list, and over at the small boy tying his boots, and back at the list."], ["“Why did he not say?”", "“Because you said Thabo first,” said Sibu, “and then everybody did.”"], ["## Six", "The coach walked over to where Thapelo was sitting."], ["He crouched down so that his face was level with the boy's face, which Sibu thought was a good thing to do.", "“Thapelo,” he said. “I am sorry. I read the wrong name off my list and I did not check. That was my mistake, not yours.”"], ["Thapelo nodded. He did not say anything. But he looked, Sibu thought, like somebody who had put down something heavy."], ["## Seven", "It took the other boys about three days to stop saying Thabo."], ["They got it wrong and corrected themselves and got it wrong again, and nobody made a fuss about it, which was right."], ["By the end of the second week Thapelo turned around the moment his name was shouted, every single time."], ["## Eight", "Sibu does not think he did anything very brave.", "He thinks it would have been braver to say it on the first day."], ["But he has noticed since that nobody else said it at all, in six days, and that everybody had heard the boy not turning around."], ["He tries to be the one who says it now. Not always. More than he used to."]], "wc": 506, "words": [{"w": "soccer", "m": "a game where you kick a ball into a goal"}, {"w": "morning", "m": "the early part of the day"}, {"w": "coach", "m": "the person who trains a team"}, {"w": "shouted", "m": "called out loudly"}, {"w": "shrugged", "m": "lifted your shoulders to show you do not know"}, {"w": "afternoon", "m": "the time after midday"}, {"w": "mistake", "m": "something done wrong"}, {"w": "practice", "m": "training to get better"}, {"w": "corrected", "m": "made right"}, {"w": "brave", "m": "not afraid to do something hard"}]}, {"title": "The Tuck Shop Sum", "blurb": "The church tuck shop is short by R47 every Sunday. Lerato is asked to find out why. She thinks it will take one Sunday.", "n": 8, "pages": [["## One", "The tuck shop at church sold sweets, chips, cooldrinks and vetkoek after the service every Sunday."], ["It was run by Mrs Dube, who had run it for years, and it had a small tin box for the money and a book where she wrote down what she had at the start and what she had at the end."], ["For four Sundays in a row the money had been short. Not by much. By about forty-seven rand each time."], ["## Two", "Mrs Dube was upset about it. She had not taken it. Nobody had seen anybody take it."], ["“You are good with numbers,” she said to Lerato, who was ten and helped her on Sundays. “Find out where it is going.”"], ["Lerato said yes, and thought it would take one Sunday."], ["## Three", "It took five."], ["On the first Sunday she counted everything before the service started: every packet of chips, every can, every vetkoek."], ["Then she counted everything that was left at the end, and worked out what had been sold."], ["By her sums the tin should have had three hundred and twelve rand in it.", "It had two hundred and sixty-five. Forty-seven short. Again."], ["## Four", "On the second Sunday she watched the tin the whole time. Nobody touched it who should not have."], ["It was forty-seven short.", "She started to wonder whether she was counting wrong. She counted everything three times and got the same answer every time."], ["## Five", "On the third Sunday she did not watch the tin.", "She watched what people did when they paid."], ["And she saw it almost straight away, and could not believe she had missed it for two weeks."], ["The vetkoek were seven rand each. People would give Mrs Dube a ten-rand coin, and she would give them change, and then a lot of them would say <i>keep the change</i>, and she would smile and put the three rand in her apron pocket, not in the tin."], ["## Six", "It was not stealing. Mrs Dube was not taking anything."], ["She was being given tips, and she was keeping them separate, the way she always had, because they were given to her.", "At the end of the day she put the pocket money in the collection plate."], ["It was all going to the church. It just was not going through the tin, so the tin was always short by exactly the tips."], ["## Seven", "Lerato had to work out how to say this without it sounding like an accusation."], ["She wrote it down first, carefully: what she had counted, what the tin should have had, what it did have, and where the difference went.", "She wrote it three times to get the tone right."], ["## Eight", "Mrs Dube read it standing at the counter.", "Then she laughed for about a minute and had to sit down."], ["“Forty-seven rand,” she said. “Every Sunday I have been giving it to God and then worrying that somebody took it.”"], ["## Nine", "They changed one thing. A second small tin now sits next to the first one, and it says <i>Keep the change</i> on the side in marker pen."], ["The book now balances every Sunday, to the cent.", "Lerato still helps on Sundays. She has never once since then assumed that a missing number means a thief."]], "wc": 535, "words": [{"w": "service", "m": "a church meeting on Sunday"}, {"w": "sweets", "m": "small sugary treats"}, {"w": "church", "m": "a building where people pray"}, {"w": "numbers", "m": "we count with these"}, {"w": "counted", "m": "worked out how many"}, {"w": "change", "m": "the money you get back when you pay too much"}, {"w": "pocket", "m": "a small bag sewn into clothes"}, {"w": "separate", "m": "kept apart"}, {"w": "carefully", "m": "taking care"}, {"w": "thief", "m": "a person who steals"}]}];
const KEY = "g3-holiday";
let state={}, cur=-1, pg=0, fs=19, mode="listen";
const VOICE = ("speechSynthesis" in window);
 
async function load(){
  try{const r=await window.storage.get(KEY);state=r?JSON.parse(r.value):{};return;}catch(e){}
  try{const v=window.localStorage.getItem(KEY);state=v?JSON.parse(v):{};}catch(e){state={};}
}
async function save(){
  try{if(window.storage){await window.storage.set(KEY,JSON.stringify(state));return;}}catch(e){}
  try{window.localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
function say(t){
  if(!VOICE) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.rate=.72; u.lang="en-ZA";
  window.speechSynthesis.speak(u);
}
function drawShelf(){
  const el=document.getElementById("shelf"); el.innerHTML="";
  BOOKS.forEach((b,i)=>{
    const st=state[i]||{};
    const btn=document.createElement("button"); btn.className="book";
    let tag="";
    if(st.best!==undefined) tag=`<span class="badge">Spelling ${st.best}/${b.words.length}</span>`;
    else if(st.page) tag=`<span class="resume">Carry on &#8212; page ${st.page+1}</span>`;
    btn.innerHTML=`<span class="spine"><small style="font-size:11px;display:block;font-family:IBM Plex Mono,monospace;letter-spacing:.08em">DAY</small>${b.n}</span><span>
      <span class="bt">${b.title}</span><span class="bb">${b.blurb}</span>
      <span class="meta"><span>24 pages</span><span>${b.wc} words</span>${tag}</span></span>`;
    btn.addEventListener("click",()=>open(i));
    el.appendChild(btn);
  });
}
function open(i){
  cur=i; pg=(state[i]&&state[i].page)?state[i].page:0;
  document.getElementById("shelfview").classList.add("off");
  document.getElementById("reader").classList.add("on");
  document.getElementById("rtitle").textContent=BOOKS[i].title;
  document.getElementById("novoice").classList.toggle("on",!VOICE);
  if(!VOICE) setMode("mean"); else setMode(mode);
  draw(); window.scrollTo(0,0);
}
function draw(){
  const b=BOOKS[cur], last=pg>=b.pages.length;
  document.getElementById("storyview").style.display=last?"none":"block";
  document.getElementById("sp").classList.toggle("on",last);
  if(!last){
    document.getElementById("page").innerHTML=b.pages[pg].map(l=>
      l.startsWith("## ")?`<h2 class="chap">${l.slice(3)}</h2>`:`<p>${l}</p>`).join("");
    document.getElementById("pnum").textContent=`${pg+1} of ${b.pages.length}`;
    document.getElementById("prev").disabled=pg===0;
    document.getElementById("next").textContent=pg===b.pages.length-1?"Spelling test":"Next";
    document.getElementById("bar").style.width=((pg+1)/b.pages.length*100)+"%";
  }
  state[cur]=Object.assign({},state[cur],{page:Math.min(pg,b.pages.length-1)});
  save();
}
function setMode(m){
  mode=m;
  document.getElementById("mListen").setAttribute("aria-pressed",m==="listen");
  document.getElementById("mMean").setAttribute("aria-pressed",m==="mean");
  document.getElementById("si").textContent = m==="listen"
    ? "Press Say it. The laptop reads a word from the book out loud. Type it, then press Check."
    : "Read what the word means. Write the word. The first letter and the number of letters are given to help you.";
  buildItems();
}
function buildItems(){
  const b=BOOKS[cur], el=document.getElementById("items"); el.innerHTML="";
  b.words.forEach((it,i)=>{
    const d=document.createElement("div"); d.className="item";
    const top = mode==="listen"
      ? `<button class="say" data-w="${it.w}">&#9654; Say it</button>
         <span class="clue hint" id="h${i}"></span>`
      : `<span class="clue">${it.m}
         <span class="hint">&nbsp;&nbsp;${it.w[0].toUpperCase()} &#183; ${it.w.length} letters</span></span>`;
    d.innerHTML=`<div class="itop"><span class="n">${i+1}.</span>${top}</div>
      <div class="ans"><input type="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" aria-label="Word ${i+1}"><span class="tick" id="t${i}"></span></div>`;
    el.appendChild(d);
  });
  el.querySelectorAll(".say").forEach((btn,i)=>{
    btn.addEventListener("click",()=>{
      say(btn.dataset.w);
      document.getElementById("h"+i).textContent = btn.dataset.w.length + " letters";
    });
  });
  document.getElementById("score").classList.remove("on");
}
function check(){
  const b=BOOKS[cur], inputs=document.querySelectorAll("#items input");
  let right=0;
  inputs.forEach((inp,i)=>{
    const ok=inp.value.trim().toLowerCase()===b.words[i].w.toLowerCase();
    inp.classList.toggle("ok",ok);
    inp.classList.toggle("no",!ok&&inp.value.trim()!=="");
    const t=document.getElementById("t"+i);
    t.textContent=ok?"\u2713":(inp.value.trim()?"\u2717":"");
    t.className="tick "+(ok?"ok":"no");
    if(ok) right++;
  });
  const n=b.words.length, s=document.getElementById("score");
  let msg;
  if(right===n) msg=`<b>${right} out of ${n}.</b> Every single one. Go and tell somebody.`;
  else if(right>=n-2) msg=`<b>${right} out of ${n}.</b> Nearly all of them. Try the red ones once more.`;
  else if(right>=n/2) msg=`<b>${right} out of ${n}.</b> Good going. Sound out the red ones slowly.`;
  else msg=`<b>${right} out of ${n}.</b> Try the other button &#8212; it gives you the meaning and the first letter.`;
  s.innerHTML=msg; s.classList.add("on");
  const prev=(state[cur]&&state[cur].best)||0;
  state[cur]=Object.assign({},state[cur],{best:Math.max(prev,right)});
  save();
}
document.getElementById("next").addEventListener("click",()=>{if(pg<BOOKS[cur].pages.length){pg++;draw();window.scrollTo(0,0);}});
document.getElementById("prev").addEventListener("click",()=>{if(pg>0){pg--;draw();window.scrollTo(0,0);}});
document.getElementById("back").addEventListener("click",()=>{
  if(VOICE) window.speechSynthesis.cancel();
  document.getElementById("reader").classList.remove("on");
  document.getElementById("shelfview").classList.remove("off");
  drawShelf(); window.scrollTo(0,0);});
document.getElementById("check").addEventListener("click",check);
document.getElementById("clear").addEventListener("click",buildItems);
document.getElementById("reread").addEventListener("click",()=>{pg=0;draw();window.scrollTo(0,0);});
document.getElementById("mListen").addEventListener("click",()=>setMode("listen"));
document.getElementById("mMean").addEventListener("click",()=>setMode("mean"));
document.getElementById("bigger").addEventListener("click",()=>{fs=Math.min(fs+2,31);
  document.documentElement.style.setProperty("--fs",fs+"px");});
document.getElementById("smaller").addEventListener("click",()=>{fs=Math.max(fs-2,15);
  document.documentElement.style.setProperty("--fs",fs+"px");});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("reader").classList.contains("on")) return;
  if(document.activeElement.tagName==="INPUT") return;
  if(e.key==="ArrowRight") document.getElementById("next").click();
  if(e.key==="ArrowLeft") document.getElementById("prev").click();});
load().then(drawShelf);
</script>
</body>
</html>
