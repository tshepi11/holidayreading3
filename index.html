 margin:18px 0 -2px;padding-bottom:7px;border-bottom:2px solid var(--ink);

.weekhead:first-child{margin-top:4px}
.wdone{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
 letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.spine small{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
 text-transform:uppercase;font-weight:600}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;
 margin:18px 0 -2px;padding-bottom:7px;border-bottom:2px solid var(--ink);
 font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em}
.weekhead:first-child{margin-top:4px}

.book:hover{border-color:var(--accent)}
.book:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.mode{display:flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;width:max-content;margin-bottom:22px}
.mode button{background:transparent;border:0;padding:9px 16px;font-family:"IBM Plex Mono",monospace;

.mode button+button{border-left:1.5px solid var(--ink)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.item{padding:14px 0;border-bottom:1px solid var(--rule)}
.itop{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--soft);min-width:24px}

.ans input:focus{outline:0;border-color:var(--accent)}
.ans input.ok{border-color:var(--good);background:#F2F9F5}
.ans input.no{border-color:var(--bad);background:#FDF3F2}
.tick{font-size:19px}.tick.ok{color:var(--good)}.tick.no{color:var(--bad)}
.hint{font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.22em;color:var(--soft)}
.acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.acts button{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:2px;
 padding:11px 20px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;font-weight:600}
.acts button.ghost{background:transparent;color:var(--ink)}
.score{margin-top:22px;padding:16px 18px;background:var(--accent-l);border-left:4px solid var(--accent);
 font-size:16px;display:none}
.score.on{display:block}
.novoice{font-size:13px;color:var(--bad);margin-bottom:16px;display:none}
.novoice.on{display:block}
@media(max-width:560px){.book{grid-template-columns:46px 1fr;gap:12px}.spine{height:70px;font-size:24px}
 .ans{padding-left:0}.itop{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap">
<div class="shelfview" id="shelfview">
  <header>
    <div class="kicker">Grade 3 · Reading</div>
    <h1>My Reading Shelf</h1>
    <p class="lede">One book a day, Monday to Friday. Each week gets a little harder as it goes. Read the whole book, then do the spelling at the back.</p>
  </header>
  <div class="shelf" id="shelf"></div>
</div>

<div class="reader" id="reader">
  <div class="rbar">
    <button class="back" id="back">&#8592; Shelf</button>
    <span class="rtitle" id="rtitle"></span>
    <span class="sizer">
      <button id="smaller" aria-label="Smaller text">A&#8722;</button>
      <button id="bigger" aria-label="Bigger text">A+</button>
    </span>
  </div>
  <div id="storyview">
    <div class="pagewrap"><div class="page" id="page"></div></div>
    <div class="nav">
      <button id="prev">Back</button>
      <span class="pnum" id="pnum"></span>
      <button id="next">Next</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="sp" id="sp">
    <div class="sh">Spelling</div>
    <p class="si" id="si"></p>
    <div class="mode" role="group" aria-label="Choose how to practise">
      <button id="mListen" aria-pressed="true">Listen &amp; type</button>
      <button id="mGap" aria-pressed="false">Fill the gap</button>
    </div>
    <p class="novoice" id="novoice">This browser will not read the words out. Use <b>Fill the gap</b> instead, or ask a grown-up to read them.</p>
    <div id="items"></div>
    <div class="acts">
      <button id="check">Check my answers</button>
      <button class="ghost" id="clear">Clear</button>
      <button class="ghost" id="reread">Read it again</button>
    </div>
    <div class="score" id="score"></div>
  </div>
</div>
</div>
<script>
const BOOKS = [{"title": "The Thing About Chickens", "blurb": "Six chickens, a shed door, and a notebook. Tebogo works out that keeping something alive is mostly arithmetic.", "week": 3, "day": "Monday", "level": 1, "pages": [["## One — Six Chickens", "The chickens arrived in a cardboard box with holes punched in the lid, and Tebogo's uncle put the box down on the concrete and said, “Six. If you get to six in a year you have done well. Most people do not.”"], ["“Why would I not get to six?”", "His uncle looked at him for a moment and then decided not to answer, which Tebogo found more worrying than any answer would have been."], ["They were not yellow and fluffy. Tebogo had expected yellow and fluffy. These were half grown, brown and white and slightly ragged, with hard yellow eyes and feet like small dinosaurs, and the moment the lid came off they went in six different directions across the yard."], ["His sister Palesa, who was six, named all six of them within the first hour, and the names were Blackie, Whitey, Spotty, Chicken, Number Five and Gladys, and nobody could ever afterwards explain Gladys.", "Tebogo told her it was a mistake to name livestock. He had heard a man say this at the co-op and had been waiting for an opportunity to use it."], ["It took him and his sister forty minutes to get them into the shed."], ["## Two — The Notebook", "His uncle gave him an exercise book as well as the chickens, and Tebogo thought at the time that this was a strange gift and slightly insulting."], ["“Write down what they eat,” his uncle said. “Write down what it costs. Write down how many eggs. Every day. Not most days.”", "“Why?”", "“Because otherwise in six months you will not know whether these chickens are feeding you or you are feeding them, and you will think you know, and you will be wrong.”"], ["Tebogo wrote it down for eleven days and then stopped, because nothing was happening. The chickens ate. They did not lay. He put the book on the shelf above his bed."], ["The trouble with writing things down every day is that most days nothing happens, and a book full of days when nothing happened does not feel like information. It feels like a waste of a book.", "That is the trap, and Tebogo fell into it, and almost everybody does."], ["## Three — The First Egg", "The first egg came on a Tuesday in the second week of April and it was smaller than he had expected and slightly pointed at one end, and he carried it into the kitchen in both hands as though it were made of glass."], ["His mother fried it and cut it in half and gave half to his sister, and Tebogo was furious about this for the rest of the day and could not properly explain why, even to himself."], ["By May there were three or four eggs a day. He got the notebook down off the shelf and started again, and this time he did not stop."], ["## Four — What the Book Said", "By the end of July the book said something Tebogo had not expected it to say."], ["He worked out that a chicken lays best in the first two years and then tails off, and he worked this out not from anybody telling him but from the shape of his own columns, which is a different kind of knowing and stays with you longer."], ["A bag of feed cost a certain amount and lasted about nineteen days. He had written down every bag. He had also written down every egg, in a column, with a line under each week."], ["When he added the eggs up and worked out what the same number of eggs cost at the shop, and put that next to what the feed had cost him, the two numbers were almost exactly the same."], ["He checked it three times because he thought he must have made a mistake."], ["He also discovered, in the middle of June, that a chicken will eat almost anything from the kitchen that is not citrus, and that this changes the feed number considerably, and that his mother had been throwing away roughly a bucket a week of things the birds would have been delighted with."], ["“So I am working for nothing,” he said to his uncle.", "“Are you?”"], ["“The eggs cost the same as the feed. So there is no point.”"], ["## Five — The Part He Had Not Counted", "His uncle took the book and read it properly, turning the pages slowly, which took about ten minutes and during which Tebogo said nothing at all."], ["“Where are the chickens in this book?” he said finally."], ["“What do you mean? They are the whole book.”", "“No. The eggs are in this book. The feed is in this book. Where are the six chickens?”"], ["“And the manure,” said his uncle. “Where is the manure in the book? You have not bought fertiliser since March. Your mother's spinach is the best it has been in four years and you have not written down one word about it.”", "Tebogo opened his mouth and closed it again."], ["Tebogo did not understand for a moment. Then he did."], ["He had not counted the chickens themselves. Six half-grown ragged birds had come in a cardboard box in February, and it was now the end of July, and all six were alive and fully grown and worth considerably more than they had been worth in February — and none of that appeared anywhere in his arithmetic."], ["“Also,” said his uncle, handing the book back, “you have not lost one. In your first year. That is the part I would write down in capital letters if I were you.”"], ["## Six — The Shed Door", "In September something got into the shed at night and killed two of them."], ["The thing that got in was probably a mongoose, his uncle said, or possibly a large rat, and it did not matter which, because the answer to both was the same answer and the answer was the gap under the door."], ["Tebogo found them in the morning. He was nine and he had fed those birds twice a day for seven months and he sat down on the concrete step and cried, properly, for about a minute, and then stopped and went and got a spade."], ["The door had a gap at the bottom of about eight centimetres. It had always had a gap at the bottom of about eight centimetres. He had walked past it four hundred times."], ["He fixed it that afternoon with a piece of plank and six nails, and it took him twenty minutes, and the twenty minutes were the worst twenty minutes of the whole year, because the entire time he was doing it he was thinking about how he could have done it in February."], ["## Seven — Writing It Down", "He wrote it in the book that evening. Not the money — the other thing."], ["Palesa cried for three days and would not be comforted, and refused to eat eggs for two weeks afterwards, and then one morning ate two without mentioning it, and Tebogo had the sense not to say anything."], ["<i>14 September. Lost 2. Gap under shed door 8cm. Fixed with plank. Should have checked in February.</i>"], ["He has that book still. He is grown and he keeps about two hundred birds now, in four sheds, and he still writes everything down every day, and the first thing he does with any new shed — before the birds go anywhere near it — is get down on his knees and look along the bottom of the door."]], "wc": 1222, "words": [{"w": "cardboard", "s": "The chickens arrived in a ___ box with holes punched in the lid."}, {"w": "exercise", "s": "His uncle gave him an ___ book as well as the chickens."}, {"w": "kitchen", "s": "He carried it into the ___ in both hands."}, {"w": "expected", "s": "It was smaller than he had ___ and slightly pointed at one end."}, {"w": "column", "s": "He had written down every egg, in a ___, with a line under each week."}, {"w": "mistake", "s": "He checked it three times because he thought he must have made a ___."}, {"w": "counted", "s": "He had not ___ the chickens themselves."}, {"w": "centimetres", "s": "The door had a gap at the bottom of about eight ___."}, {"w": "afternoon", "s": "He fixed it that ___ with a piece of plank and six nails."}, {"w": "worrying", "s": "Tebogo found that more ___ than any answer would have been."}]}, {"title": "Four Hundred Years", "blurb": "Zanele's class adopts a hundred metres of river. What they pull out of it in the first week fills eleven bags.", "week": 3, "day": "Tuesday", "level": 2, "pages": [["## One — The Hundred Metres", "The idea came from the new Grade 6 teacher, who had been at the school for three weeks and did not yet know which things were not done."], ["What she proposed was that the class adopt a hundred metres of the river — the stretch behind the sports field, between the concrete bridge and the bend where the willows were — and take responsibility for it. Not clean it once. Adopt it."], ["“For how long?” somebody asked.", "“Until you leave the school.”", "There was a silence in which thirty-one children worked out that this meant three and a half years."], ["## Two — Eleven Bags", "They went down on the first Friday with black bags and gloves, and Zanele, who had walked over that bridge twice a day for six years, discovered that she had never once looked over the side of it."], ["The mattress was the worst of it. It had been in the water long enough to have become something else entirely, and it took six of them to get it up the bank, and it weighed what felt like a hundred kilograms because it was full of water and mud and, in the end, a great many small living things that they tipped carefully back into the reeds."], ["Below the bridge, caught in the reeds on the near bank, there was a mattress."], ["There was also, in the first hundred metres: nine tyres, more plastic bottles than anybody counted properly, two shopping trolleys, a car seat, roughly forty shoes, none of which matched, a television with no screen, and an astonishing quantity of small blue plastic bags wound around the roots of everything."], ["It took eleven bags and three and a half hours and they did not finish."], ["## Three — The Argument", "The argument started on the walk back and went on all the following week."], ["Sipho's position was that the whole thing was pointless, because the rubbish did not come from their hundred metres. It came from upstream, from the settlement above the bridge and from the industrial area above that, and it would keep coming, and they would keep picking it up, forever, and nothing would change."], ["The teacher did not take sides in the argument, which infuriated everybody. What she did instead was write both positions on the board, word for word, with the children's names next to them, and leave them there for the entire term."], ["Zanele's position was that this was probably true and did not matter."], ["“It does matter,” said Sipho. “If you cannot fix a thing, doing a small bit of it is just making yourself feel better.”"], ["This was, Zanele admitted privately, quite a good argument, and it bothered her for two days before she found the answer to it, and the answer she found was not a very clever one. It was simply this: that the frogs did not care whose fault it was."], ["Zanele's older brother said something at supper that helped, though he was not trying to help and was mostly looking at his phone.", "“The hospital does not stop taking people in because more people keep getting sick,” he said. “That is not an argument. That is just what a hospital is.”"], ["## Four — What Lives There", "They found the frogs in the third week."], ["Once the plastic came out of the reeds on the near bank, and stayed out, the reeds started doing what reeds do, and by the third week there were frogs in them, and by the fifth week there were a great many frogs in them, and at night you could hear them from the sports field."], ["The teacher made them count. That was the thing about her: everything had to be counted and written down, and at the time it seemed like an unnecessary amount of paperwork."], ["Week three: frogs heard, not counted.", "Week five: 40 or more calling at once, impossible to count individually.", "Week nine: a dragonfly, the first anybody had seen.", "Week fourteen: two hadeda ibises feeding in the shallows below the bridge, present most mornings."], ["It became, without anybody deciding it, the ordinary way the class spent Friday afternoons. There were weeks when they filled two bags and weeks when they filled a quarter of one, and the weeks with a quarter of a bag were, Zanele noticed, the ones that felt best, which was a strange thing to get used to."], ["## Five — Four Hundred Years", "It was in the second term that Zanele looked up how long a plastic bottle lasts."], ["The number was four hundred and fifty years, and she did not really believe it, so she looked it up in two more places, and it was four hundred and fifty years in both of them."], ["Week twenty-two: water clear enough to see the bottom at the bend, first time recorded.", "Week twenty-six: no tyres this week. First week with no tyres.", "Week thirty-one: somebody has dumped building rubble at the bridge. Eleven bags. Worst week since week one."], ["She sat with that for a while."], ["Four hundred and fifty years ago there had been no bridge, no sports field, no school, no concrete anywhere on that river. If somebody had dropped a plastic bottle in the water then, it would still have been there when she pulled it out in March, and it would have been the same bottle, essentially unchanged, having outlasted every single person who had ever walked past it."], ["The bottle she had thrown in a bin that morning would still be somewhere in the year two thousand four hundred and seventy-six."], ["## Six — The Letter", "The class wrote to the industrial park in June. The teacher made them write it four times."], ["The first version was angry and the teacher said it was satisfying and would be thrown away. The second version was polite and said nothing. The third version was better. The fourth version had numbers in it, because by June they had fourteen weeks of counted data, and numbers, the teacher said, are much harder to throw away than feelings."], ["They got a reply in August. It was two paragraphs long, and mostly said nothing, and one sentence in the middle of it said that the drainage outlet behind the packaging plant would be fitted with a screen."], ["Writing it four times nearly broke them. Sipho said, correctly, that the fourth version was more boring than the first, and the teacher said, also correctly, that boring letters get answered and interesting ones get shown to people in the corridor and then filed."], ["It was fitted in October. Zanele went and looked at it. It was about a metre wide and made of steel mesh and it had, at that moment, roughly thirty plastic items caught against it that would otherwise have been in the river."], ["## Seven — Sipho, Afterwards", "Sipho never admitted he had been wrong, because he had not been wrong. The rubbish did keep coming. They did keep picking it up. It is still coming now."], ["What he said instead, years later, at somebody's birthday, was this:"], ["“I was right about the river. I was wrong about the point. I thought the point was to fix it.”", "“What was the point?” somebody asked."], ["Zanele went back to look at the screen every few months for years, the way you check on something you are not sure you believe in. It was always there. It was always full. It was, she thought, the least glamorous object she had ever been proud of."], ["“The frogs,” said Sipho. “The frogs were the point, and the frogs did not need us to fix the whole river. They needed a hundred metres of it.”"]], "wc": 1258, "words": [{"w": "bridge", "s": "The stretch behind the sports field, between the concrete ___ and the bend."}, {"w": "plastic", "s": "More ___ bottles than anybody counted properly."}, {"w": "argument", "s": "The ___ started on the walk back and went on all the following week."}, {"w": "pointless", "s": "Sipho's position was that the whole thing was ___."}, {"w": "upstream", "s": "It came from ___, from the settlement above the bridge."}, {"w": "counted", "s": "Everything had to be ___ and written down."}, {"w": "dragonfly", "s": "Week nine: a ___, the first anybody had seen."}, {"w": "industrial", "s": "The class wrote to the ___ park in June."}, {"w": "drainage", "s": "The ___ outlet behind the packaging plant would be fitted with a screen."}, {"w": "shallows", "s": "Two hadeda ibises feeding in the ___ below the bridge."}]}, {"title": "The Night Shift", "blurb": "Kabelo's mother sleeps in the day and works while he sleeps. For eight years he has known this. This year he finds out what it means.", "week": 3, "day": "Wednesday", "level": 3, "pages": [["## One — The Rules of the House", "The rules of the house were not written anywhere and Kabelo could not remember being taught them, in the same way he could not remember being taught which tap was hot."], ["Between eight in the morning and half past two in the afternoon, the passage door stayed shut. You did not run in the passage. You did not use the tap in the bathroom because the pipes knocked. The television was allowed but not the volume. If a visitor knocked you went to the gate yourself and dealt with it there."], ["His mother worked nights at the hospital and slept in the day, and had done since before he could remember, and to Kabelo this was as ordinary as the sun."], ["There was a fourth rule that was not really a rule, which was that you did not tell people at school that your mother was asleep, because of the particular face they made, and Kabelo had worked this out for himself at about the age of six and had never told anybody he had worked it out."], ["## Two — The Question at School", "It came up in class because of a lesson about people who work at night."], ["The teacher listed them on the board — nurses, security guards, bakers, taxi drivers on the early routes, people at the power stations, people who fix the roads — and asked whether anybody's family worked at night, and Kabelo put up his hand along with four other children."], ["Afterwards, in the corridor, a boy called Neo said, “So does your mother sleep the whole day then?”", "“She sleeps in the day, yes.”", "“So she does nothing all day and nothing all night. She just sleeps and goes to work.”"], ["Kabelo did not have an answer to this and it annoyed him all the way home, mostly because he realised on the way that he did not actually know what his mother did at the hospital. He knew she was a nurse. That was the whole of it."], ["## Three — The Question at Home", "He asked her at half past three, which was the hour after she got up, when she sat at the kitchen table with coffee and was not quite awake and was, he had learned, easiest to talk to."], ["What annoyed him most, walking home, was not Neo. It was that he had said “she is a nurse” in exactly the same tone he would have used to say she was tall, as though it were a fact about her shape."], ["“What do you actually do?”", "She looked at him over the cup."], ["“That is a big question for a Tuesday.”", "“A boy at school said you sleep all day and work all night and that is all.”"], ["His mother put the cup down and thought about it, and did not seem cross, which he had been slightly afraid of."], ["“Come with me on Friday,” she said. “Not the whole night. Until nine. Your aunt can fetch you.”"], ["“Will they let me in?”", "“You will sit in the corridor by the window and you will not go past the yellow line, and if I tell you to move you will move immediately and ask afterwards.”", "“That is a yes.”", "“That is a yes,” she agreed."], ["## Four — The Ward at Seven", "The hospital at seven in the evening was not what Kabelo expected, and what he had expected, he realised, was a kind of quiet."], ["It was not quiet. Somewhere a machine was beeping in a slow steady rhythm. A trolley went past with a wheel that squeaked. Two people were talking behind a curtain. A telephone rang four times and stopped."], ["The floor was extremely shiny and smelled of something sharp that he could not name."], ["His mother put on a different face when she came through the doors. That was the thing he watched hardest. She did not become a different person exactly, but something in the way she walked and held her shoulders changed at the door, and stayed changed."], ["He had also expected, without ever putting it into words, that the people in the beds would look like people in beds. They did not. They looked like his neighbours, his uncle, the man who sold him airtime, the woman from church — they looked entirely ordinary, in pyjamas, in a building, at night."], ["## Five — What She Did", "In two hours Kabelo watched his mother do the following things, which he wrote down afterwards because he did not want to lose them."], ["She checked eleven people's charts and wrote on nine of them.", "She changed a dressing on an old man's leg, talking to him the entire time about his grandson's soccer team, in a completely ordinary voice, while doing something to the leg that Kabelo could not look at."], ["She worked out that a machine was giving a wrong reading rather than that a patient was getting worse — she did this in about four seconds, from the doorway, and Kabelo did not understand how and she could not explain it afterwards except to say that the number was wrong for that person."], ["She sat on the end of a bed for six minutes with a woman who was crying, and said almost nothing."], ["She told a young doctor, politely and without any fuss at all, that he had written something in the wrong column, and the young doctor said thank you and changed it."], ["Twice, somebody asked her a question that Kabelo could tell was not really a question. An old woman asked what time it was, three times in an hour, and each time his mother told her the actual time in a completely normal voice, and did not once say “I have already told you.”"], ["She cleaned up a mess that Kabelo had assumed somebody else would be called to clean up."], ["## Six — The Thing He Had Not Understood", "His aunt fetched him at nine and he was quiet in the car."], ["What he had not understood — what the boy Neo had not understood, and what Kabelo would have gone on not understanding for years — was not that his mother worked hard. He knew that. Everybody's mother worked hard; that was not news to anybody at that school."], ["It was that eleven people in that building were going to be alive in the morning partly because of the specific decisions his mother made between eleven at night and four in the morning, and that she made those decisions while everybody she loved was asleep, and that she came home and made his breakfast afterwards and did not mention any of it, ever, once."], ["He asked her about the machine on the way out. She said something about the number being wrong for that person, and then said, more usefully, “You see nine hundred of them. After nine hundred your eyes do it before your head does. That is all it is. There is no trick in it.”", "Kabelo has since come to believe that this is true of almost everything and that almost nobody says so."], ["## Seven — The Passage Door", "Kabelo is careful about the passage door now in a way he was not careful before."], ["It is the same rule. It was always the same rule. Nothing about the rule changed on that Friday."], ["But there is a difference between keeping a rule because it is the rule and keeping it because you know what is on the other side of the door, and Kabelo could not have explained that difference to Neo, or to anybody at school, and he stopped trying."], ["He simply went home every day and did not run in the passage."], ["His aunt asked him in the car whether he had enjoyed it, and he said yes, which was not the right word and was the only word he had."]], "wc": 1282, "words": [{"w": "passage", "s": "Between eight and half past two, the ___ door stayed shut."}, {"w": "hospital", "s": "His mother worked nights at the ___ and slept in the day."}, {"w": "corridor", "s": "Afterwards, in the ___, a boy called Neo asked him a question."}, {"w": "annoyed", "s": "It ___ him all the way home."}, {"w": "kitchen", "s": "She sat at the ___ table with coffee and was not quite awake."}, {"w": "trolley", "s": "A ___ went past with a wheel that squeaked."}, {"w": "shoulders", "s": "Something in the way she walked and held her ___ changed at the door."}, {"w": "dressing", "s": "She changed a ___ on an old man's leg."}, {"w": "politely", "s": "She told a young doctor, ___ and without any fuss at all."}, {"w": "decisions", "s": "Eleven people were going to be alive because of the ___ she made."}]}, {"title": "The Day the River Came Up", "blurb": "It had been raining for nine days. On the tenth day Sipho's father started moving the furniture, and nobody argued with him.", "week": 3, "day": "Thursday", "level": 4, "pages": [["## One — Nine Days of Rain", "It had been raining for nine days, and by the ninth day it had stopped being weather and started being a condition, like an illness the whole street had caught at the same time.", "Nothing dried. Sipho's school shoes had been standing in front of the stove for four days and were still cold and damp inside in the mornings. The washing hung across the kitchen on a line and got in everybody's face and never dried either, and his mother had stopped taking it down at all."], ["The river ran a hundred and fifty metres below their house, at the bottom of a slope of long grass and thorn trees. In an ordinary week you could not hear it from the yard.", "By the seventh day you could hear it from the yard.", "By the ninth day you could hear it from inside the house with the door shut, a low sound underneath everything else, more like a weight than a noise."], ["“It is loud,” said Sipho at supper.", "“It is full,” said his father, who worked on the roads and had opinions about water that Sipho was used to hearing and did not always listen to. “There is a difference. A river makes that noise when it is carrying things.”"], ["“Carrying what?”", "“Trees. Fence posts. Whatever was standing next to it further up.”"], ["His mother put down her fork. “How far up?”", "“That is the question,” said his father, and did not answer it, and went out onto the step with his tea to listen."], ["## Two — The Tenth Morning", "Sipho woke on the tenth morning because someone was dragging furniture."], ["It was half past four. His father had the kitchen table upside down in the passage and was taking the legs off it with a spanner, working fast and without hurrying, which Sipho had learned were two different things."], ["“Get dressed,” his father said. “Shoes on. Not slippers.”"], ["Sipho went to the window instead."], ["The slope down to the river was gone. Not covered — gone. Where the long grass had been there was brown water, moving fast and completely smooth on top, and it had come up level with the bottom of the thorn trees, which meant it had risen eleven or twelve metres in the night."], ["A blue plastic drum went past in the middle of it, travelling at the speed of a car."], ["“Shoes,” said his father from the passage, without raising his voice."], ["## Three — High Things First", "They did not run. That was the part Sipho remembered afterwards and could not explain properly to anybody at school: that there was time, and his father used it, and used it in a particular order."], ["Documents first. His mother took the biscuit tin with the identity documents and the birth certificates and the title deed in it, put it in a plastic bag, tied the top, put that in a second bag, tied that, and put it inside her jacket. It took her ninety seconds and she did not have to think about where anything was."], ["“Why first?” Sipho asked.", "“Because a bed can be replaced,” said his mother, “and proving who you are cannot. Not quickly.”"], ["Then the high things. Anything that could be lifted went on top of the wardrobe or on top of the roof beams in the back room where the ceiling was open: the blankets, the clothes, the two boxes of photographs, the sewing machine, his mother's certificates in their frames."], ["Sipho was small enough to get up into the roof and stack things where his father passed them up. He was up there for an hour. The tin roof was ten centimetres above his head and the rain on it was so loud that his father had to throw a shoe at his leg to get his attention."], ["“The fridge,” his father shouted. “We cannot lift the fridge. Leave it.”"], ["## Four — The Gogo Problem", "At six o'clock his father went next door to Gogo Mahlangu, and came back four minutes later, and stood in the kitchen with rain running off his chin, and said, “She will not come.”"], ["“What do you mean she will not come?”", "“She says she has been in this house forty-one years and the water has never once come past the fig tree.”"], ["“The fig tree is under the water,” said Sipho's mother."], ["“I know that,” said his father. “She cannot see it from her window. Her window faces the road.”"], ["Sipho's mother took off her apron, which she did approximately twice a year, and went out of the door without a coat."], ["What she said to Gogo Mahlangu, nobody ever found out. She was gone eleven minutes and she came back with the old woman on her arm, and Gogo Mahlangu was carrying one suitcase and complaining continuously in a low voice all the way up the hill, and she complained the entire time they were at the school, and she complained on the way back three days later."], ["Sipho's father said afterwards that the complaining was the best sound he heard that week."], ["## Five — The School Hall", "The school was on the ridge, which was why it had been built there, which Sipho had never thought about once in four years of walking up to it."], ["By nine in the morning there were about two hundred people in the hall. By midday there were closer to four hundred and the school had run out of floor and people were sitting in the corridors and in two of the classrooms."], ["It was not what Sipho expected. He had expected crying, and there was some, mostly from small children who were tired.", "What there mostly was, was organisation."], ["Somebody had made a list of everybody in the building by half past ten. Somebody else was walking round with a bucket and a cup. Three women from the church had taken over the school kitchen and were making pap in a pot the size of a bath, and there was an argument about salt that went on for two hours and was, Sipho thought, the most normal thing that happened all day."], ["His father did not sit down. He went out with four other men at eleven and came back at three, and went out again, and Sipho did not ask where because he could see from his face that the answer would not be a good one."], ["## Six — What the Water Left", "They went back down on the Wednesday, when the river had dropped nearly as fast as it had risen."], ["Sipho had imagined the house knocked flat. It was not. It was standing exactly where it had always been, and from the road it looked completely ordinary, and that was somehow worse."], ["Inside, there was a brown line on the wall at the height of his chest."], ["Everything below that line was ruined and everything above it was fine. The photographs in the roof were fine. The blankets were fine. His mother's certificates were fine. The fridge had floated into the middle of the kitchen, turned around, and settled facing the wrong way, full of mud."], ["There was mud on everything, a fine grey-brown mud that had got inside cupboards, inside the kettle, inside a closed tin of coffee, and which dried to a dust that got into your throat when you swept it."], ["They swept and washed for eleven days."], ["## Seven — Afterwards", "Sipho's father put a nail in the wall at the top of the brown line before they repainted, and left the nail there, and painted around it."], ["It is still there. It is above Sipho's head now, which it was not then."], ["He asked his father once, years later, how he had known on the tenth morning — how he had known to start moving furniture at half past four when the water was still down at the trees."], ["“I did not know,” his father said.", "“Then why?”"], ["“Because if I was wrong,” his father said, “we would have carried everything back down out of the roof on Tuesday and I would have looked like a fool in front of my wife. And if I was right and I had waited, we would have lost the photographs.”", "He shrugged. “Those are not the same size of mistake. So it was not a difficult decision. It was only an early one.”"]], "wc": 1375, "words": [{"w": "condition", "s": "It had stopped being weather and started being a ___."}, {"w": "furniture", "s": "Sipho woke on the tenth morning because someone was dragging ___."}, {"w": "documents", "s": "___ first. His mother took the biscuit tin."}, {"w": "wardrobe", "s": "Anything that could be lifted went on top of the ___."}, {"w": "photographs", "s": "The ___ in the roof were fine."}, {"w": "spanner", "s": "His father was taking the legs off it with a ___."}, {"w": "corridors", "s": "People were sitting in the ___ and in two of the classrooms."}, {"w": "ordinary", "s": "From the road it looked completely ___, and that was somehow worse."}, {"w": "kitchen", "s": "The fridge had floated into the middle of the ___."}, {"w": "mistake", "s": "Those are not the same size of ___."}]}, {"title": "The Name on the Board", "blurb": "There is a wooden board in the school hall with sixty-one names on it. Refilwe wants to know who number thirty-four was.", "week": 3, "day": "Friday", "level": 5, "pages": [["## One — Sixty-One Names", "The board had been on the wall of the hall since before anybody currently at the school had been born, and it had been painted around at least twice, which Refilwe could tell because there was a line of slightly different green along the bottom edge."], ["It was dark wood, about a metre and a half tall, and it had sixty-one names on it in gold letters, in two columns, under the words FORMER LEARNERS OF THIS SCHOOL."], ["Nobody had ever explained it. It was simply furniture. Children sat under it in assembly twice a week for seven years and looked at the back of somebody's head."], ["Refilwe had counted the names once in Grade 4, during a long assembly, out of pure boredom, and had got sixty-one, and had then counted again to check and got sixty-one again, and that was the entire extent of her interest for three years."], ["## Two — Number Thirty-Four", "Refilwe noticed number thirty-four because of the surname."], ["It was her own surname, spelled the same unusual way her family spelled it, which was not the common spelling and which she had spent her whole life correcting people about."], ["<b>34. M. T. Sithole</b>", "That was all it said. No dates. No first name. Nothing else."], ["She asked the teacher on duty, who said she did not know. She asked the principal's secretary, who said the board had come from the old school building when they moved in 1994, and that was everything she knew about it."], ["The secretary, who was kind, let her take a photograph of the board on the school tablet and print it out, and that printout is the thing Refilwe still has in a folder, soft at the folds now, with pencil all over it."], ["She asked her mother, who said she had no idea, and then said, after a pause, “Ask Gogo.”"], ["## Three — The Wrong Question", "Gogo was ninety-one and did not always come out of the past when you spoke to her, and Refilwe had learned that the trick with her was patience and not correcting her."], ["“There is a board at my school,” Refilwe said. “With names. One of them is M. T. Sithole.”"], ["Gogo did not react at all, and Refilwe thought she had not heard, and was about to say it again when Gogo said, without opening her eyes, “Morwesi.”"], ["Refilwe had learned this the hard way at about the age of seven, when she had corrected Gogo about a year and Gogo had stopped talking for the rest of the afternoon, and her mother had explained afterwards that being right and being useful were not always the same job."], ["“Who?”", "“Morwesi Thandiwe. She was my mother's sister's child. She was in that school in nineteen fifty-something.”"], ["Refilwe sat very still, in the way you do when a bird lands near you."], ["## Four — What the Board Does Not Say", "It took four visits over three weeks to get the whole of it, and it came out of order and with long gaps, and twice Gogo fell asleep in the middle."], ["Morwesi Thandiwe Sithole had been the first person in that family, on either side, to finish school. Not the first girl. The first person."], ["Some of it Gogo told twice, in different versions, and Refilwe wrote down both versions and did not choose between them, which she has since learned is what actual historians do and which she was doing at eleven for no better reason than that she could not bring herself to throw either one away."], ["She had walked, according to Gogo, an hour and ten minutes each way, and had done it for five years, and had done the last two years of it while also working on Saturdays and Sundays at a house in town, because the school fees had to come from somewhere and there was nowhere else for them to come from."], ["She had gone on to train as a teacher.", "She had taught for thirty-one years."], ["She had died in 2003, when Refilwe's mother was already grown, which meant — and this was the part that Refilwe found hardest to sit with — that they had been alive at the same time for nothing at all, because Refilwe had been born in 2016."], ["## Five — The Problem With Boards", "“Why does it just say M. T.?” Refilwe asked her mother."], ["“She used to send money,” Gogo said once, apropos of nothing, halfway through a different conversation. “Every month. Not much. For thirty years. That is how your grandfather finished building this room you are sitting in.”", "Refilwe looked at the walls of the room she was sitting in and did not say anything for a while."], ["“Because that is how they did it.”", "“But then nobody knows who she was.”"], ["“You know who she was.”", "“I know because Gogo is still alive,” said Refilwe. “What about number twelve? What about number fifty-eight? Somebody's Gogo knew who they were and now nobody does.”"], ["Her mother did not have an answer to that, and said so, which Refilwe respected."], ["## Six — The Project", "The project took Refilwe and four other learners the whole of Grade 6 and most of Grade 7, and it was not a school project, and nobody gave them marks for it."], ["What they did was this. They photographed the board. They typed out all sixty-one names. Then they went and asked."], ["They asked at the church. They asked at the clinic. They put a sheet of paper up in the shop with the names on it and a phone number. They sat with eleven old people over eighteen months and recorded what those people remembered, on a phone, and typed it up afterwards, badly and slowly."], ["Of the sixty-one names, they found something — anything at all — about twenty-nine."], ["The hardest part was not the old people. The old people were, almost without exception, delighted to be asked, and made tea, and talked for far longer than the children had planned for, and this became a scheduling problem that they never solved.", "The hardest part was the typing."], ["Twenty-nine out of sixty-one. Refilwe found this failure unbearable for about a month, and then stopped finding it unbearable, because a woman at the clinic said something to her that she has repeated many times since."], ["“Twenty-nine is not what you lost,” the woman said. “Twenty-nine is what you caught. Next year it would have been twenty-two.”"], ["## Seven — The Second Board", "The second board went up in the hall in Refilwe's last term, next to the first one, and it is not made of dark wood and it does not have gold letters, because there was no money for that."], ["Two of the twenty-nine turned out to be the same person, listed twice under different initials, which meant the board had been wrong on the wall for sixty years and nobody had ever noticed. Refilwe found this more upsetting than the thirty-two blanks, and could not explain why, and still cannot."], ["It is a large printed panel behind glass, and it has the same sixty-one numbers on it, and next to twenty-nine of them there is a paragraph."], ["Number thirty-four's paragraph is four lines long. It gives her full name. It says when she was at the school and how far she walked and what she did afterwards and for how long, and it ends with the sentence: <i>She was the first person in her family to finish school.</i>"], ["Under the whole thing, at the bottom, in smaller letters, it says:", "<i>Thirty-two of these people are not described here because we could not find out in time. If you know any of them, please tell the school.</i>"], ["## Eight — What It Is Actually For", "Three names have been filled in since Refilwe left. She hears about it when it happens; somebody always phones her mother."], ["She is at university now, studying history, which surprised nobody at all."], ["The school did not want to put the sentence about the thirty-two on the panel. There was a meeting about it. The argument against was that it looked like a failure to have it written up on the wall where visitors could see it.", "Refilwe, who was thirteen and was allowed to speak at the end, said that it was a failure, and that leaving it off would not make it less of one, it would only make it harder to fix.", "They put it on."], ["She says the thing she took from it was not about history and not really about her great-aunt. It was this: that a name on a wall is not a record of a person. It is a receipt for a person, and a receipt is only any use if somebody kept the rest of the paperwork."], ["“Write it down,” she says, when she is asked to speak to school groups, which she finds embarrassing and does anyway. “Whoever they are. Write down more than the initials. The initials are what is left when everybody who knew has died.”"]], "wc": 1477, "words": [{"w": "assembly", "s": "Children sat under it in ___ twice a week for seven years."}, {"w": "surname", "s": "Refilwe noticed number thirty-four because of the ___."}, {"w": "principal", "s": "She asked the ___'s secretary, who said the board came from the old building."}, {"w": "patience", "s": "The trick with her was ___ and not correcting her."}, {"w": "teacher", "s": "She had gone on to train as a ___."}, {"w": "recorded", "s": "They sat with eleven old people and ___ what they remembered."}, {"w": "unbearable", "s": "Refilwe found this failure ___ for about a month."}, {"w": "paragraph", "s": "Next to twenty-nine of them there is a ___."}, {"w": "initials", "s": "The ___ are what is left when everybody who knew has died."}, {"w": "university", "s": "She is at ___ now, studying history."}]}, {"title": "The Boy Who Counted Taxis", "blurb": "Neo counts the taxis at the rank for eleven weeks. Nobody asked him to, and nobody believes him when he says what he found.", "week": 4, "day": "Monday", "level": 1, "pages": [["## One — A Boring Reason", "Neo started counting taxis for the most boring reason there is, which is that he was waiting for his mother and there was nothing else to do."], ["Her shift at the packing plant ended at half past five and she was never out before six, and the rank was where he waited, on the low wall by the third pole, four afternoons a week."], ["The first afternoon he counted 41 taxis leaving for town between four and six. He told his mother in the car and she said that was nice."], ["He started because of an argument with his father, who said the rank was busier in the morning, and Lesego, who walked past it twice a day, was certain it was busier in the afternoon, and neither of them had anything except certainty."], ["The second afternoon he counted them again because he could not remember whether 41 had been high or low, and this is, in fact, the entire reason anybody has ever kept a record of anything."], ["## Two — The Shape of It", "By the end of the third week he had a page of numbers and the numbers had a shape."], ["Mondays were the busiest. Fridays were nearly as busy but the rush came earlier, from about half past three. Wednesdays were the quietest, consistently, and Neo could not think of a single reason why Wednesday should be different from Tuesday or Thursday, and it bothered him."], ["The first week's numbers were useless and he knew it while he was writing them down. He had counted for different lengths of time on different days, and you cannot compare eleven minutes on Monday with twenty on Thursday."], ["He also noticed something that had nothing to do with the days: on the afternoons when it rained, the number went up sharply, and it went up more than the number of people did."], ["He watched for two more rainy afternoons before he understood why: when it rained, the people who normally walked took a taxi. The queue did not get longer. It filled up faster."], ["He tested the rain thing twice more before he let himself believe it, because he had already learned by then that the first explanation you think of is usually the one you wanted."], ["## Three — The Argument in the Car", "“Wednesday is pay-week shopping day at the plant,” his mother said, when he eventually complained to her about Wednesdays."], ["So he fixed the method: fifteen minutes exactly, at the same two times, in the same place, with the same starting point on the road, and he wrote the weather at the top of each page because he had a suspicion about rain."], ["“What does that mean?”", "“It means half the women on my line do their shopping straight from work on a Wednesday, at the Spar by the plant, and walk home afterwards with it. So they do not come through the rank.”"], ["Neo sat with that for the rest of the drive."], ["He had found a real thing in his numbers, a thing that was genuinely there, and he had had no chance whatsoever of explaining it, because the explanation was inside a building he had never been into, about people he had never met, for a reason that had nothing to do with taxis."], ["## Four — The Queue Problem", "In the eighth week Neo started counting a second thing: how long the queue was at half past five."], ["The suspicion about rain turned out to be right and was the only thing in the whole notebook that surprised his father, who had driven a taxi for nine years."], ["This turned out to be much harder than counting taxis, because a queue is not a number, it is a shape that keeps changing, and by the time you have counted the back of it the front of it has gone."], ["He solved it by counting in a different way. He stopped counting people and started counting how long one particular person waited: he picked whoever was standing at the paint mark on the wall when he started, and timed them until they got into a taxi."], ["The average was eleven minutes. On Mondays it was nineteen. In the rain it was twenty-six."], ["Twenty-six minutes standing in the rain with shopping is not the same kind of number as twenty-six minutes standing in the sun, and Neo wrote a note to himself about that in the margin, which is the first time he had ever written anything in a margin."], ["Four weeks of numbers said the morning was busier by about a third, and Lesego, who had been arguing the opposite since February, had to say so out loud at supper, which he found much harder than the counting."], ["## Five — Nobody Believes a Child With a Page", "Neo told the man who ran the rank."], ["It did not go the way he had imagined it in his head on the walk over. The man was not unkind. He was busy, and he was being told about his own rank by a nine-year-old with an exercise book, and he said, “I have been here twenty years, my boy,” which was true and which was also not an answer."], ["Neo went home fairly flattened."], ["His father did not gloat, which Lesego noticed and has never forgotten. He said, “Now we both know instead of both thinking,” and passed the potatoes."], ["## Six — The Second Try", "What changed it was his mother, who said one sentence over supper that Neo has thought about ever since."], ["“You told him what you counted,” she said. “You did not tell him what it would get him.”"], ["So Neo did it again. He spent a week working out one number, and the number was this: if two extra taxis ran between half past four and half past five on Mondays, the average wait would come down from nineteen minutes to about twelve, and those two taxis would carry roughly thirty extra fares in that hour that were currently going to the rank down the road."], ["He wrote it on one page. Not eleven weeks of numbers. One page, with the thirty on it."], ["## Seven — What Happened", "The man read it standing up, which Neo took as a bad sign, and then read it again sitting down, which he took as a better one."], ["Nothing happened for six weeks."], ["Then, in October, two extra taxis started running the Monday late-afternoon slot, and nobody ever told Neo that it was because of him, and he was never entirely certain that it was."], ["## Eight — The Part He Kept", "He kept counting anyway, for another two years, long after the interest had worn off, out of a sort of stubbornness."], ["What he says now, when anybody asks him why he does the job he does, is that he learned three things on that wall, and he learned all of them by accident."], ["That a number on its own persuades nobody.", "That the reason for a pattern is almost never inside the pattern.", "And that eleven weeks of boring afternoons is not a lot to pay for one page that somebody reads sitting down."]], "wc": 1158, "words": [{"w": "counting", "s": "Neo started ___ taxis for the most boring reason there is."}, {"w": "shift", "s": "Her ___ at the packing plant ended at half past five."}, {"w": "consistently", "s": "Wednesdays were the quietest, ___."}, {"w": "eventually", "s": "When he ___ complained to her about Wednesdays."}, {"w": "explanation", "s": "The ___ was inside a building he had never been into."}, {"w": "average", "s": "The ___ was eleven minutes."}, {"w": "exercise", "s": "A nine-year-old with an ___ book."}, {"w": "supper", "s": "What changed it was his mother, who said one sentence over ___."}, {"w": "roughly", "s": "Those two taxis would carry ___ thirty extra fares."}, {"w": "stubbornness", "s": "He kept counting out of a sort of ___."}]}, {"title": "The House With Two Doors", "blurb": "When Ayanda's family moves, she is given the job of measuring every room. She finds something in the numbers that the adults have missed.", "week": 4, "day": "Tuesday", "level": 2, "pages": [["## One — The Job Nobody Wanted", "They were moving in three weeks and there was a furniture problem, which was that nobody knew whether the furniture would fit."], ["The new house had been seen twice, briefly, by adults who had been thinking about roofs and damp and where the electricity box was, and neither of them had thought to bring a tape measure, and both of them said the rooms were “a good size”, which Ayanda pointed out was not a measurement."], ["“Then you do it,” said her father, who had had a long week."], ["The front door was for visitors and was opened perhaps six times a year. The back door was for everybody else, every day, and was never locked until the last person was in."], ["He meant it as the end of the conversation. Ayanda took it as a job."], ["## Two — Learning to Measure", "The first thing she discovered was that she did not know how to measure a room."], ["She measured the lounge on the Saturday and got 4 m 20 along one wall, and then measured it again to check and got 4 m 45, and the difference between those two numbers was twenty-five centimetres, which is a great deal when you are trying to fit a couch."], ["The problem was that she was measuring along the floor by eye and the tape was wandering. Her uncle showed her how to hold one end against the skirting board with her foot and walk the other end straight, and after that she got 4 m 22 three times in a row."], ["Nobody had ever explained this. It was one of the hundred things a child absorbs about a house without a single sentence being said about it."], ["“Three times the same,” he said. “That is the test. Not that it is right. That it is the same.”"], ["## Three — The Book", "She drew each room on a page: a rough rectangle, the measurement on each wall, and a small square for every door and window with its width written next to it."], ["It took her two afternoons. It would have taken her one, except that she started again after the first afternoon because she had not been writing down which way the doors opened, and she realised halfway through that a door that opens inwards eats about ninety centimetres of wall that you cannot put anything against."], ["This detail turned out to matter more than any other single thing in the book."], ["The visitor stood at the front door for eleven minutes, which Boitumelo knew because she watched the kitchen clock the whole time, and it was the longest anybody had ever stood at that door."], ["## Four — The Couch", "The couch was 2 m 10 long."], ["The lounge in the new house had four walls, and Ayanda measured all four, and the useful lengths were: 4 m 22, 3 m 15, 2 m 05, and 3 m 90."], ["The 2 m 05 wall was five centimetres too short.", "The 4 m 22 wall had the door in it, opening inwards.", "The 3 m 90 wall had the window, which was fine for a couch, except that the plug point was there and the television would have to be somewhere else entirely."], ["She sat on her bed with the book for about an hour."], ["Afterwards her grandmother explained that the front door was not really a door. It was a way of telling somebody what kind of conversation this was going to be, before anybody had said anything."], ["## Five — The Thing the Adults Missed", "What she found was not in any one measurement. It was in two of them together."], ["The new house had two doors into the lounge — one from the passage and one from the kitchen. She had drawn both, because she was drawing all the doors. Nobody had mentioned this to her as being interesting and she had not thought it was interesting either."], ["But the kitchen door and the passage door were on adjacent walls, three metres apart, and both opened inwards, and when she drew the arc of each door swinging open she could see that the two arcs met."], ["Which meant there was a strip of floor, roughly three metres by one metre, in the corner between them, that could never have anything in it. Not a chair. Not a shelf. Nothing. It was a corridor that was not on any plan and that nobody had noticed because you cannot see it unless you draw both doors open at the same time, and nobody ever opens both doors at the same time."], ["“So when you brought her round the back,” said Boitumelo, “you were saying something.”", "“I was saying a great deal,” said her grandmother, “and she heard every word of it, and that is why she cried.”"], ["The lounge was three square metres smaller than everybody thought it was."], ["## Six — Telling Them", "Ayanda did not tell them at supper. She had learned something from a previous occasion about announcing things at supper."], ["She waited until the Sunday, and she did not say “the lounge is smaller”, because she had worked out on Saturday night that this was the least convincing possible way to say it."], ["Boitumelo has thought about that a lot since, and about how many things get said in a house without anybody opening their mouth, and about how a stranger would not have understood one of them."], ["What she did was put the drawing on the table with the two arcs shaded in pencil, and say: “Where are we going to put the television?”"], ["Her father looked at it for about fifteen seconds."], ["Then he said a word he did not usually say in front of her, and apologised, and looked at it for another minute."], ["## Seven — What They Did", "They took the kitchen door off."], ["Not permanently — they took it off its hinges and stood it in the garage, and hung a curtain in the doorway instead, which cost forty rand and took her uncle twenty minutes, and gave back the whole three square metres."], ["The couch went along the 3 m 90 wall. The television went on the 3 m 15 wall with an extension cord run along the skirting, which her mother complained about for a year and then stopped noticing."], ["## Eight — Afterwards", "Ayanda still has the book. It is a school exercise book with a green cover and it has eleven pages in it and every page is a room."], ["She has measured four houses since, for other people, including one for a woman at church who insisted on paying her."], ["The thing she says about it, when she is asked, is that she did not find anything clever. She measured what she was told to measure, and she drew what she measured, including the boring parts, and the thing was simply sitting there in the drawing waiting for somebody to look at it."], ["“Nobody missed it because they were stupid,” she says. “They missed it because they never drew it. You cannot see a thing you have not drawn.”"]], "wc": 1157, "words": [{"w": "measure", "s": "Neither of them had thought to bring a tape ___."}, {"w": "centimetres", "s": "The difference between those two numbers was twenty-five ___."}, {"w": "skirting", "s": "Hold one end against the ___ board with your foot."}, {"w": "rectangle", "s": "She drew each room on a page: a rough ___."}, {"w": "inwards", "s": "A door that opens ___ eats about ninety centimetres of wall."}, {"w": "adjacent", "s": "The kitchen door and the passage door were on ___ walls."}, {"w": "corridor", "s": "It was a ___ that was not on any plan."}, {"w": "convincing", "s": "This was the least ___ possible way to say it."}, {"w": "permanently", "s": "Not ___ &#8212; they took it off its hinges."}, {"w": "exercise", "s": "It is a school ___ book with a green cover."}]}, {"title": "The Wrong Bus", "blurb": "Thabo gets on the 4B instead of the 4A. By the time he notices, the bus is on a road he has never seen in his life.", "week": 4, "day": "Wednesday", "level": 3, "pages": [["## One — Four Minutes Late", "He was four minutes late to the stop, and that was the whole cause of it, and he has thought about those four minutes many times since."], ["The 4A and the 4B leave from the same bay. They have the same green stripe. For the first eleven stops they run the same route, and then, at a set of traffic lights near the industrial park, the 4A turns left and the 4B goes straight."], ["Thabo had caught the 4A twice a day for two years. He got on without looking, because you do not look at a thing you have looked at four hundred times, and he sat down and put his earphones in."], ["## Two — The Lights", "He noticed at the lights."], ["He could have looked. The number is on the front in white on black, sixty centimetres high, and it is also on a card in the window by the door, and the driver says it out loud at the bay. There were three separate chances to know and he took none of them, because knowing already is the most expensive thing there is."], ["Not because he was paying attention — he was not — but because the bus did not lean. There is a particular lean when a bus turns left at that corner, and he had felt it twice a day for two years, and his body noticed its absence before his head did."], ["He took out one earphone and looked up and the industrial park was on the wrong side of the window."], ["## Three — The First Bad Minute", "The first thing he felt was not fear. It was embarrassment, which he has since decided is one of the most dangerous feelings there is, because of what it makes you do next."], ["What it made him want to do was nothing. To sit still, and look ordinary, and not be a boy who had got on the wrong bus in front of thirty adults."], ["He sat there for two more stops doing exactly that."], ["A woman across the aisle looked at him twice. He is fairly sure now that she knew, and that she was waiting to see whether he would ask, and that if he had asked she would have helped immediately. He did not ask."], ["By the time he stood up, the bus was on a road he had never seen in his life, and the sun was going down on the wrong side of him, and there were fields."], ["## Four — What He Had", "He made himself do an inventory, sitting down again, because standing up had made his legs feel strange."], ["He had: a school bag, a maths textbook, an apple, a phone with eleven percent battery, R14.50 in coins, a bus card with enough on it for two more trips, and a jersey."], ["He did not have: any idea where he was."], ["He counted the money twice. Fourteen rand fifty is not nothing and it is also not enough for a taxi from somewhere you cannot name, and understanding that clearly was, oddly, the moment he started to feel better rather than worse."], ["He took the phone out and looked at eleven percent and made the most sensible decision of the entire afternoon, which was not to look at a map, and not to look up the route, but to phone his mother first, while he still had a battery to phone her with."], ["## Five — The Phone Call", "“I am on the 4B,” he said. “I meant to be on the 4A.”"], ["There was a short silence on the other end that he understood, later, was his mother deciding not to shout."], ["“Are you on the bus now?”", "“Yes.”", "“Stay on it. Do not get off in the dark somewhere you do not know. What can you see?”"], ["“Do not walk,” his mother said. “Whatever else you do. Do not decide the garage looks close to somewhere and start walking. Stay where the lights are and let me come to you.”"], ["“Fields. A sign that says something Vlei. There is a garage coming up.”"], ["“Get off at the garage. Garages have lights and people and a phone. Stand inside where the person at the till can see you. Phone me when you are standing there and then switch your phone off to save it.”"], ["## Six — The Garage", "The garage was called Sasol and had four pumps and a shop with a bright white light in it that you could see from a long way down the road."], ["Thabo stood inside near the fridges. The woman at the till looked at him twice and then came over, and he told her the truth, which he had decided on the walk in was going to be the policy."], ["“Wrong bus,” she said. “The 4B. It happens about twice a month.”", "“Twice a month?”", "“Same bay, same stripe,” she said. “It is a stupid design.”"], ["This helped Thabo more than almost anything else that happened that evening, and she did not know she was doing it."], ["## Seven — Waiting", "She let him wait inside. She gave him a cup of tea he had not asked for and would not take money for it."], ["He learned afterwards that the 4B goes out past the vlei and loops back and that if he had stayed on it for another fifty minutes it would have brought him within four kilometres of his own house, which felt like important information and was not."], ["His uncle came in a bakkie and it took fifty minutes, and Thabo sat by the window the whole time and watched three sets of headlights come and not be his uncle before the fourth one was."], ["He was not frightened in the garage. He wants that written down, because when he tells this story people assume he was frightened the whole time, and he was frightened for about eleven minutes, on the bus, between the traffic lights and the phone call."], ["## Eight — What He Does Now", "There was no shouting at home. His mother asked him one question, which was what he would do differently, and he said get off at the first stop after noticing, and she said no, and he was surprised."], ["“The first stop after noticing was in the middle of nowhere,” she said. “You did the right thing by staying on until there were lights. What you would do differently is four minutes earlier at the stop, and look at the number on the front.”"], ["The tea was too sweet. He drank all of it."], ["Thabo looks at the number on the front now. Every time, for years, on every bus, including buses he has caught a thousand times."], ["People who travel with him find it slightly irritating."]], "wc": 1099, "words": [{"w": "industrial", "s": "At a set of traffic lights near the ___ park, the 4A turns left."}, {"w": "earphones", "s": "He sat down and put his ___ in."}, {"w": "absence", "s": "His body noticed its ___ before his head did."}, {"w": "embarrassment", "s": "The first thing he felt was ___."}, {"w": "ordinary", "s": "To sit still, and look ___, and not be a boy who had got on the wrong bus."}, {"w": "inventory", "s": "He made himself do an ___, sitting down again."}, {"w": "battery", "s": "To phone his mother while he still had a ___ to phone her with."}, {"w": "garage", "s": "___s have lights and people and a phone."}, {"w": "headlights", "s": "He watched three sets of ___ come and not be his uncle."}, {"w": "frightened", "s": "He was ___ for about eleven minutes, on the bus."}]}, {"title": "What the Photograph Did Not Show", "blurb": "There is one photograph of Refilwe's great-grandmother. It took a year to work out that almost everything she thought it showed was wrong.", "week": 4, "day": "Thursday", "level": 4, "pages": [["## One — The Photograph", "There was one photograph, and it lived in a brown envelope inside a Bible, and it came out about twice a year."], ["It showed a woman standing in front of a wall, straight-backed, in a dark dress with a white collar, holding a handbag with both hands in front of her. She was not smiling. Nobody in old photographs is smiling."], ["On the back, in pencil: <i>Johanna. 1961.</i>"], ["It was not a good photograph. It was slightly out of focus at the edges and there was a mark across one corner where something had been spilled on it, probably decades ago, and nobody had ever thought to have it copied."], ["## Two — What Everybody Knew", "What everybody in the family knew about Johanna was three things, repeated so often that they had worn smooth like a coin."], ["She was strict. She worked in a shop in town. She died before any of the grandchildren were born."], ["Sifiso, who was eleven, had heard those three things his whole life and had never once thought to wonder whether three things was a small number of things to know about a person."], ["## Three — The Project That Started It", "It started as a school project about family history, which he did badly and handed in late."], ["Sifiso had assumed, without ever examining the assumption, that the dress was her dress, the wall was a wall she knew, and the photograph had been taken by somebody who loved her. None of those three things turned out to be true, and the third one was the one he minded losing."], ["The project asked for three generations. He got two, easily, and then stopped, and the stopping annoyed him for reasons that had nothing to do with the marks."], ["He asked his grandmother about the photograph.", "“That is my mother,” she said. “She was strict. She worked in a shop in town.”", "“I know. What else?”", "His grandmother looked at the photograph for a while and said, “I do not know what else.”"], ["## Four — The Handbag", "It was his aunt in Durban who said the thing that opened it, and she said it on the phone, casually, as an aside."], ["“That is not her handbag,” she said. “That photograph was taken outside the studio in town. They kept a handbag and a hat there for people to hold. Everybody's photograph from that studio has that handbag in it.”"], ["Sifiso sat with the phone against his ear and looked at the photograph on the table in front of him and felt something shift."], ["“Why would anybody keep a handbag for people to hold?”", "“Because a photograph cost a week's money,” said his aunt, “and if you were paying a week's money you wanted to look like somebody who was doing well. That is not pretending. That is a message.”"], ["The handbag was a prop. The dress might be a prop. The wall was a studio wall."], ["Almost nothing in the photograph was actually hers."], ["## Five — What a Photograph Is", "This bothered him for about a week, and then it stopped bothering him and became interesting, which is a change he has noticed happens to him quite often and which he now waits for."], ["Because if the handbag was not hers, the photograph was still evidence. It was just evidence of something else."], ["It was evidence that in 1961 a woman had walked into a studio in town and paid money — real money, money that was needed for other things — to have a photograph taken of herself."], ["“Why would she do that?” he asked his grandmother.", "“To send it,” said his grandmother, immediately, as though it were obvious, and then stopped, because she had not known she knew that."], ["The trip to Kimberley took nine hours each way and his mother nearly did not let him go, and the argument about it lasted two weeks and was, in the end, settled by his grandmother, who said very little and said it once."], ["## Six — Send It To Whom", "It took four months and eleven phone calls and one trip to Kimberley."], ["Johanna had a brother. Nobody in Sifiso's part of the family had ever mentioned a brother, not because it was a secret but because he had left in 1959 to work on the mines and the two halves of the family had simply drifted apart the way families do when nobody writes."], ["He had a granddaughter. She was sixty-two and lived in Kimberley and she had, in a biscuit tin, four letters."], ["## Seven — The Letters", "The letters were from Johanna to her brother, between 1960 and 1964."], ["They were not interesting letters, and Sifiso says this without disappointment, because it took him a while to understand that this was the point. They were about rain. They were about the price of things. Three of the four mention a cousin's leg."], ["In the second letter, one line: <i>I am sending you this photograph so you can see I am keeping well.</i>"], ["The biscuit tin also had a school report, two funeral programmes and a great many buttons, and the woman in Kimberley apologised for the state of it, and Sifiso said, entirely honestly, that it was the best thing he had ever been shown."], ["And in the fourth letter, near the end, a sentence that Sifiso photographed on his phone and has never deleted:", "<i>Do not send money this month, we are managing, send it next month rather when the school fees are due, and do not tell Ma I asked.</i>"], ["## Eight — Strict", "That sentence rearranged the woman in the photograph."], ["Because <i>strict</i>, which was one of only three things anybody remembered about her, is the word a child uses. It is what you are called by people who were small when they knew you and who never got to know you afterwards."], ["The letters are not the letters of a strict woman. They are the letters of somebody managing a household on very little, planning two months ahead, and protecting her mother from knowing how tight it was."], ["“She was not strict,” Sifiso said to his grandmother. “She was worried. Those look the same from underneath.”"], ["His grandmother, who was seventy-four, cried, which he had not expected and did not know what to do with, and afterwards said that she was not crying about her mother. She was crying because she had been calling her strict for sixty years."], ["He has since found two more people who are related to him through Elias and one of them lives eleven kilometres away and had no idea, and they now have Sunday lunch about four times a year and it is slightly awkward and completely worth it."], ["## Nine — The Envelope Now", "The photograph is still in the brown envelope in the Bible. Nothing about the photograph has changed."], ["What is different is that the envelope now also has four photocopied letters in it, and a typed page that Sifiso wrote, which begins:", "<i>Johanna Sithole, born about 1918. Worked at Ackermans in town. One brother, Elias, who went to the mines in 1959. She wrote to him at least until 1964. She sent money for school fees and asked him not to tell their mother.</i>"], ["“It is still not much,” Sifiso says, when people ask. “It is eleven lines. But it is eleven lines instead of three words, and
